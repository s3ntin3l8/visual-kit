name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    uses: s3ntin3l8/.github/.github/workflows/release-please.yml@main

  # Chained off release-please's outputs: a release published by GITHUB_TOKEN does not fire
  # a separate `release:` event.
  docker-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: s3ntin3l8/.github/.github/workflows/docker-publish.yml@main
    with:
      image-name: s3ntin3l8/visual-kit # -> ghcr.io/s3ntin3l8/visual-kit
      push-release: true
      release-tag: ${{ needs.release-please.outputs.tag_name }}
      platforms: linux/amd64
